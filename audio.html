<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Symbicort Rapihaler 居家衛教</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'Helvetica Neue', '微軟正黑體', Arial, sans-serif;
  background: #E8F4F0;
  min-height: 100vh;
  padding: 16px 12px 40px;
}

/* ── 頂部 ── */
.top-bar {
  text-align: center;
  margin-bottom: 14px;
}
.top-bar .hospital {
  font-size: 14px;
  color: #5a8a78;
  letter-spacing: 0.5px;
}
.top-bar .title {
  font-size: 22px;
  font-weight: 800;
  color: #0a5c44;
  margin-top: 4px;
  line-height: 1.3;
}

/* ── 主卡片 ── */
.card {
  background: #fff;
  border-radius: 24px;
  padding: 24px 20px 28px;
  max-width: 500px;
  margin: 0 auto;
  box-shadow: 0 4px 24px rgba(10,92,68,0.12);
}

/* ── 病患徽章 ── */
.patient-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #e8f5ef;
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 22px;
}
.patient-label { font-size: 15px; color: #5a8a78; }
.patient-id {
  font-size: 20px;
  font-weight: 800;
  color: #0f6e56;
  letter-spacing: 2px;
}

/* ── 播放器大區塊 ── */
.player-wrap {
  background: linear-gradient(135deg, #0a5c44 0%, #1a9e76 100%);
  border-radius: 22px;
  padding: 28px 20px 24px;
  margin-bottom: 22px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.player-wrap::before {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
}

.player-icon { font-size: 56px; display: block; margin-bottom: 8px; }
.player-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 4px;
}
.player-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.80);
  margin-bottom: 22px;
}

/* 進度條 */
.progress-track {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.25);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 8px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 5px;
  transition: width 0.5s linear;
  width: 0%;
}
.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  color: rgba(255,255,255,0.75);
  margin-bottom: 24px;
}

/* ── 大播放按鈕 ── */
.play-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  z-index: 1;
  -webkit-tap-highlight-color: transparent;
}
.play-btn:active { transform: scale(0.92); }
.play-btn svg { width: 44px; height: 44px; fill: #0f6e56; }
.play-label {
  font-size: 18px;
  font-weight: 700;
  color: rgba(255,255,255,0.95);
  margin-top: 4px;
  letter-spacing: 1px;
}

audio { display: none; }

/* ── 狀態欄 ── */
.status-bar {
  background: #fff8e8;
  border: 2px solid #f5d87a;
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 16px;
  color: #7a5800;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
}
.status-bar.success { background: #e8f5ef; border-color: #7dd4b0; color: #0a5c44; }
.status-bar.error   { background: #fef0f0; border-color: #f5a0a0; color: #7a1a1a; }
.status-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #f5c842;
  flex-shrink: 0;
  animation: blink 1.4s ease-in-out infinite;
}
.status-dot.done  { background: #1a9e76; animation: none; }
.status-dot.error { background: #e05555; animation: none; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ── 完成橫幅 ── */
.complete-banner {
  display: none;
  background: #e8f5ef;
  border: 2.5px solid #1a9e76;
  border-radius: 18px;
  padding: 20px 16px;
  text-align: center;
  margin-bottom: 20px;
}
.complete-banner.show { display: block; }
.complete-banner .big-check { font-size: 48px; margin-bottom: 8px; }
.complete-banner h3 {
  font-size: 22px;
  font-weight: 800;
  color: #0a5c44;
  margin-bottom: 6px;
}
.complete-banner p {
  font-size: 16px;
  color: #5a8a78;
  line-height: 1.6;
}

/* ── 統計格 ── */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 22px;
}
.stat-card {
  background: #f0f9f5;
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
  border: 1.5px solid #c8e8d8;
}
.stat-val { font-size: 28px; font-weight: 800; color: #0f6e56; }
.stat-lbl { font-size: 13px; color: #6b9e8a; margin-top: 4px; }

/* ── 四步驟卡片 ── */
.steps-card {
  background: #f0f9f5;
  border: 2px solid #b8dfd0;
  border-radius: 18px;
  padding: 18px 16px;
  margin-bottom: 20px;
}
.steps-title {
  font-size: 18px;
  font-weight: 800;
  color: #0a5c44;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1.5px solid #d4ede3;
  transition: background 0.3s;
}
.step-row:last-child { border-bottom: none; }
.step-row.active {
  background: #d4f0e4;
  border-radius: 12px;
  padding: 12px 10px;
  margin: 0 -6px;
}
.step-num {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #0f6e56;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.3s, transform 0.2s;
}
.step-row.active .step-num {
  background: #1a9e76;
  transform: scale(1.1);
}
.step-text {
  font-size: 18px;
  color: #1a4a38;
  font-weight: 700;
  line-height: 1.3;
}
.step-sub {
  font-size: 14px;
  color: #6b9e8a;
  margin-top: 3px;
}
.step-icon { font-size: 28px; margin-left: auto; flex-shrink: 0; }

/* ── 重播按鈕 ── */
.replay-btn {
  width: 100%;
  padding: 18px;
  background: #0f6e56;
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  margin-bottom: 16px;
  display: none;
  letter-spacing: 1px;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.replay-btn:active { background: #0a5c44; }
.replay-btn.show { display: block; }

/* ── 底部 ── */
.footer-note {
  font-size: 14px;
  color: #8aaa9a;
  text-align: center;
  line-height: 1.7;
  padding-top: 12px;
  border-top: 1.5px solid #e0ede7;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="hospital">台大醫院雲林分院 藥劑部</div>
  <div class="title">吸入器居家學習</div>
</div>

<div class="card">

  <!-- 病患資訊 -->
  <div class="patient-row">
    <div class="patient-label">👤 病患代碼</div>
    <div class="patient-id" id="patientBadge">—</div>
  </div>

  <!-- 播放器 -->
  <div class="player-wrap">
    <span class="player-icon">🫁</span>
    <div class="player-title">Rapihaler 操作教學</div>
    <div class="player-sub">台語版・共 1 分 44 秒</div>

    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="timeNow">0:00</span>
      <span id="timeTotal">1:44</span>
    </div>

    <!-- 大播放鍵 -->
    <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="播放">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="play-label" id="playLabel">按此播放</div>

    <audio id="audioEl" preload="metadata">
      <source src="/audio/rapihaler-teaching.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- 狀態欄 -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">正在記錄學習紀錄...</span>
  </div>

  <!-- 完成橫幅 -->
  <div class="complete-banner" id="completeBanner">
    <div class="big-check">✅</div>
    <h3>今日學習完成！</h3>
    <p>學習紀錄已自動儲存<br>請繼續每天練習<br>下次回診見！</p>
  </div>

  <!-- 重播按鈕 -->
  <button class="replay-btn" id="replayBtn" onclick="replayAudio()">
    🔁 再聽一次
  </button>

  <!-- 今日統計 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="statCount">—</div>
      <div class="stat-lbl">今日播放次數</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statDays">—</div>
      <div class="stat-lbl">累計學習天數</div>
    </div>
  </div>

  <!-- 四步驟（播放時同步高亮） -->
  <div class="steps-card">
    <div class="steps-title">📋 四步驟操作重點</div>
    <div class="step-row" id="step-1">
      <div class="step-num">1</div>
      <div>
        <div class="step-text">搖晃吸入器</div>
        <div class="step-sub">上下搖晃約 5 秒</div>
      </div>
      <div class="step-icon">🤲</div>
    </div>
    <div class="step-row" id="step-2">
      <div class="step-num">2</div>
      <div>
        <div class="step-text">完全呼氣</div>
        <div class="step-sub">把肺部空氣盡量呼出</div>
      </div>
      <div class="step-icon">💨</div>
    </div>
    <div class="step-row" id="step-3">
      <div class="step-num">3</div>
      <div>
        <div class="step-text">按壓＋深吸＋屏氣</div>
        <div class="step-sub">吸入後屏住呼吸 5–10 秒</div>
      </div>
      <div class="step-icon">💊</div>
    </div>
    <div class="step-row" id="step-4">
      <div class="step-num">4</div>
      <div>
        <div class="step-text">漱口</div>
        <div class="step-sub">清水漱口 3 次，勿吞下</div>
      </div>
      <div class="step-icon">🥛</div>
    </div>
  </div>

  <div class="footer-note">
    如有任何不適，請聯絡您的藥師<br>
    台大醫院雲林分院 藥劑部｜Symbicort Rapihaler 研究計畫
  </div>

</div><!-- end card -->

<script>
// ══════════════════════════════════════
// 設定
// ══════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8OmH1WXiwqx-Eko19KKXVffu89jz-w2opkc6hI1hf2nSB13_FGWkUynA7uWPkFP8/exec';

const params = new URLSearchParams(window.location.search);
const patientId = params.get('p') || 'UNKNOWN';

document.getElementById('patientBadge').textContent = patientId;

// ══════════════════════════════════════
// 播放器
// ══════════════════════════════════════
const audio      = document.getElementById('audioEl');
const playIcon   = document.getElementById('playIcon');
const playLabel  = document.getElementById('playLabel');
const progressFill = document.getElementById('progressFill');
const timeNow    = document.getElementById('timeNow');
const timeTotal  = document.getElementById('timeTotal');

let isPlaying     = false;
let playStartTime = null;
let totalListenSec = 0;
let sessionSent   = false;
let playCount     = 0;

const PLAY_SVG  = '<path d="M8 5v14l11-7z"/>';
const PAUSE_SVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

// 音頻總長
audio.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmtTime(audio.duration);
});

// 進度更新 + 步驟高亮
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeNow.textContent = fmtTime(audio.currentTime);
  highlightStep(audio.currentTime, audio.duration);
});

// 播放結束
audio.addEventListener('ended', () => {
  isPlaying = false;
  playIcon.innerHTML = PLAY_SVG;
  playLabel.textContent = '再聽一次';
  progressFill.style.width = '100%';
  if (playStartTime) {
    totalListenSec += Math.round((Date.now() - playStartTime) / 1000);
    playStartTime = null;
  }
  sendEvent('complete', totalListenSec);
  showComplete();
  highlightStep(999, 1); // 清除高亮
  document.getElementById('replayBtn').classList.add('show');
});

function togglePlay() {
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    playIcon.innerHTML = PLAY_SVG;
    playLabel.textContent = '繼續播放';
    if (playStartTime) {
      totalListenSec += Math.round((Date.now() - playStartTime) / 1000);
      playStartTime = null;
    }
  } else {
    audio.play();
    isPlaying = true;
    playCount++;
    document.getElementById('statCount').textContent = playCount;
    playIcon.innerHTML = PAUSE_SVG;
    playLabel.textContent = '暫停';
    playStartTime = Date.now();
    document.getElementById('replayBtn').classList.remove('show');
    if (!sessionSent) {
      sendEvent('play', 0);
      sessionSent = true;
    }
  }
}

function replayAudio() {
  audio.currentTime = 0;
  progressFill.style.width = '0%';
  document.getElementById('completeBanner').classList.remove('show');
  document.getElementById('replayBtn').classList.remove('show');
  sessionSent = false;
  togglePlay();
}

// 點擊進度條跳轉
document.getElementById('progressTrack').addEventListener('click', function(e) {
  if (!audio.duration) return;
  const rect = this.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audio.currentTime = ratio * audio.duration;
});

// ══════════════════════════════════════
// 步驟同步高亮（依音檔時間比例）
// 振搖 0–25%  吐氣 25–50%  壓吸憋 50–75%  漱口 75–100%
// ══════════════════════════════════════
function highlightStep(currentTime, duration) {
  const pct = currentTime / duration;
  let active = 0;
  if (pct < 0.25)      active = 1;
  else if (pct < 0.50) active = 2;
  else if (pct < 0.75) active = 3;
  else if (pct < 1.0)  active = 4;

  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step-' + i);
    if (!el) continue;
    if (i === active) el.classList.add('active');
    else el.classList.remove('active');
  }
}

// ══════════════════════════════════════
// 工具函式
// ══════════════════════════════════════
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function setStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  bar.className = 'status-bar ' + (type || '');
  dot.className = 'status-dot ' + (type === 'success' ? 'done' : type === 'error' ? 'error' : '');
  txt.textContent = msg;
}

function showComplete() {
  document.getElementById('completeBanner').classList.add('show');
}

// ══════════════════════════════════════
// 追蹤事件
// ══════════════════════════════════════
function sendEvent(eventType, durationSec) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-TW', {
    year:'numeric', month:'2-digit', day:'2-digit'
  }).replace(/\//g, '-');

  fetch(SCRIPT_URL + '?action=nfc_track' +
    '&patient_id=' + encodeURIComponent(patientId) +
    '&event_type='  + encodeURIComponent(eventType) +
    '&duration_sec=' + durationSec +
    '&date='        + encodeURIComponent(dateStr) +
    '&timestamp='   + encodeURIComponent(now.toLocaleString('zh-TW')),
    { method: 'GET', mode: 'no-cors' }
  ).then(() => {
    if (eventType === 'play') {
      setStatus('success', '✅ 學習紀錄已記錄');
    }
    if (eventType === 'complete') {
      setStatus('success', '✅ 完整學習已儲存（' + durationSec + ' 秒）');
    }
  }).catch(() => {
    setStatus('error', '⚠️ 網路異常，請確認網路連線');
  });
}

// ══════════════════════════════════════
// 初始化
// ══════════════════════════════════════
window.addEventListener('load', () => {
  if (patientId && patientId !== 'UNKNOWN') {
    sendEvent('open', 0);
  } else {
    setStatus('error', '⚠️ 未偵測到病患代碼，請透過 NFC 貼紙開啟');
  }
});

window.addEventListener('beforeunload', () => {
  if (isPlaying && playStartTime) {
    totalListenSec += Math.round((Date.now() - playStartTime) / 1000);
  }
  if (totalListenSec > 2) {
    sendEvent('close', totalListenSec);
  }
});
</script>
</body>
</html>
